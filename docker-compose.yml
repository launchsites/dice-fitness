services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in Coolify}
      DATABASE_URL: postgres://exercise_dice:${SERVICE_PASSWORD_64_POSTGRES}@postgres:5432/exercise_dice
      GAME_CHAT_ID: ${GAME_CHAT_ID:?Set GAME_CHAT_ID in Coolify}
      TZ: ${TZ:-Europe/London}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: exercise_dice
      POSTGRES_USER: exercise_dice
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exercise_dice -d exercise_dice"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
